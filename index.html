<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria Interactive | Crafting Worlds. Igniting Play.</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        .project-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ffd000;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ffd000, 0 0 16px rgba(255, 208, 0, 0.6);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px #ffd000, 0 0 16px rgba(255, 208, 0, 0.6);
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 4px #ffd000, 0 0 8px rgba(255, 208, 0, 0.3);
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">Aetheria<span>Interactive</span></a>
            <nav>
                <a href="#games">Games</a>
                <a href="about.html">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>Crafting Immersive Worlds</h1>
            <p>Independent game development powered by passion and the desire for innovation.</p>
            <a href="#games" class="btn primary-btn">Explore Games</a>
        </div>
    </section>

    <!-- Featured Games Section -->
    <section id="games" class="projects-section">
        <div class="container">
            <h2 class="section-title">Projects</h2>

            <div class="projects-grid">
                <article class="project-card">
                    <header class="project-header">
                        <h3 class="project-title">Kart Overdrive</h3>
                        <span class="project-status">
                            <span class="status-dot"></span> In Development
                        </span>
                    </header>
                </article>
            </div>
        </div>
    </section>
    
    <!-- Footer / Social Links -->
    <footer id="contact" class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 Aetheria Interactive. All rights reserved.</p>
            <div class="social-links">
                <a href="https://aetheria-interactive.itch.io" target="_blank" rel="noopener">itch.io - </a>
                <a href="https://www.youtube.com/@AetheriaInteractive" target="_blank" rel="noopener">YouTube</a>
            </div>
        </div>
    </footer>

</body>
</html>
